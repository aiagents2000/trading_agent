name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=trading_agent --cov-report=term-missing
      - name: Smoke test (dry-run offline)
        run: uv run trading-agent cycle --dry-run --offline --journal /tmp/journal.jsonl
