[project]
name = "trading-agent"
version = "0.1.0"
description = "Team di agenti LLM che simula una trading desk per testare e validare strategie in paper trading."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "langgraph>=1.0",
  "anthropic>=1.0",
  "ccxt>=4.4",
  "loguru>=0.7",
]

[project.optional-dependencies]
equities = ["alpaca-py>=0.40"]
observability = ["langfuse>=3.0"]
backtest = ["vectorbt>=0.27"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-PyYAML",
]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
